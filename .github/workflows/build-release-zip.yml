name: Build WordPress Plugin ZIP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and attach plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare plugin folder
        run: |
          PLUGIN_SLUG="blogLogistics-maintenance-page"
          BUILD_DIR="/tmp/${PLUGIN_SLUG}"

          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}"

          rsync -av             --exclude=".git"             --exclude=".github"             --exclude="${PLUGIN_SLUG}.zip"             ./ "${BUILD_DIR}/"

      - name: Create ZIP
        run: |
          PLUGIN_SLUG="blogLogistics-maintenance-page"
          cd /tmp
          zip -r "${GITHUB_WORKSPACE}/${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}"

      - name: Upload ZIP to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLUGIN_SLUG="blogLogistics-maintenance-page"
          gh release upload "${{ github.event.release.tag_name }}" "${PLUGIN_SLUG}.zip" --clobber

      - name: Upload ZIP as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: blogLogistics-maintenance-page
          path: blogLogistics-maintenance-page.zip

      - name: Build update manifest
        if: github.event_name == 'release'
        run: |
          python3 <<'PY'
          import datetime
          import html
          import json
          import re
          from pathlib import Path

          plugin_name = "BlogLogistics Maintenance Page"
          plugin_slug = "blogLogistics-maintenance-page"
          manifest_slug = "bloglogistics-maintenance-page"
          repo_url = "https://github.com/bloglogisticsdev/blogLogistics-maintenance-page"
          tag_name = "${{ github.event.release.tag_name }}"
          version = tag_name.lstrip("v")
          download_url = f"{repo_url}/releases/download/v{version}/{plugin_slug}.zip"
          last_updated = datetime.datetime.utcnow().strftime("%Y-%m-%d")

          readme_path = Path("readme.txt")
          readme = readme_path.read_text(encoding="utf-8", errors="replace")

          changelog_match = re.search(
              r"^==\s*Changelog\s*==\s*(.*?)(?=^==\s+|\Z)",
              readme,
              flags=re.IGNORECASE | re.MULTILINE | re.DOTALL,
          )

          changelog_text = changelog_match.group(1).strip() if changelog_match else ""

          html_parts = []
          current_items = []

          def flush_items():
              nonlocal_items = list(current_items)
              current_items.clear()
              if nonlocal_items:
                  html_parts.append("<ul>")
                  for item in nonlocal_items:
                      html_parts.append(f"<li>{html.escape(item)}</li>")
                  html_parts.append("</ul>")

          for raw_line in changelog_text.splitlines():
              line = raw_line.strip()
              if not line:
                  continue

              version_heading = re.match(r"^=\s*(.*?)\s*=$", line)
              if version_heading:
                  flush_items()
                  html_parts.append(f"<h4>{html.escape(version_heading.group(1))}</h4>")
                  continue

              if line.startswith("*"):
                  current_items.append(line.lstrip("*").strip())
                  continue

              current_items.append(line)

          flush_items()

          changelog_html = "".join(html_parts) if html_parts else "<p>No changelog available.</p>"

          installation_html = (
              "<ol>"
              "<li>Upload the plugin folder to <code>/wp-content/plugins/</code>.</li>"
              "<li>Activate BlogLogistics Maintenance Page in WordPress.</li>"
              "<li>Go to <strong>BlogLogistics &gt; Maintenance Page</strong>.</li>"
              "<li>Enable maintenance mode when you need visitors to see the maintenance page.</li>"
              "<li>Optionally choose a custom maintenance image from the WordPress Media Library.</li>"
              "</ol>"
          )

          faq_html = (
              "<h4>Will administrators still see the normal site?</h4>"
              "<p>Yes. Logged-in administrators can continue viewing and editing the site normally.</p>"
              "<h4>Will visitors see the maintenance page?</h4>"
              "<p>Yes. When maintenance mode is enabled, visitors and non-administrator users will see the maintenance page.</p>"
              "<h4>Can I use a custom maintenance image?</h4>"
              "<p>Yes. You can choose a custom maintenance image from the WordPress Media Library.</p>"
              "<h4>What happens if I do not choose a custom image?</h4>"
              "<p>The plugin uses its bundled default maintenance image.</p>"
              "<h4>Does the plugin send a 503 status code?</h4>"
              "<p>Yes. When maintenance mode is active, the plugin sends a 503 Service Unavailable response.</p>"
              "<h4>Is this compatible with caching plugins?</h4>"
              "<p>The plugin sends no-cache headers and defines DONOTCACHEPAGE to reduce the chance of caching systems storing the maintenance page.</p>"
          )

          manifest = {
              "name": plugin_name,
              "version": version,
              "download_url": download_url,
              "homepage": repo_url,
              "author": "<a href=\"https://www.bloglogistics.com\" target=\"_blank\" rel=\"noopener noreferrer\">BlogLogistics</a>",
              "author_profile": "https://www.bloglogistics.com",
              "requires": "7.0",
              "tested": "7.0",
              "requires_php": "8.3",
              "last_updated": last_updated,
              "icons": {
                  "1x": "https://updates.bloglogistics.com/plugins/assets/icon-128x128.png",
                  "2x": "https://updates.bloglogistics.com/plugins/assets/icon-256x256.png",
                  "default": "https://updates.bloglogistics.com/plugins/assets/icon-128x128.png",
              },
              "banners": {
                  "low": "https://updates.bloglogistics.com/plugins/assets/banner-772x250.png",
                  "high": "https://updates.bloglogistics.com/plugins/assets/banner-1544x500.png",
                  "default": "https://updates.bloglogistics.com/plugins/assets/banner-772x250.png",
              },
              "sections": {
                  "description": "Displays a custom maintenance page for visitors while allowing administrators to access the site.",
                  "installation": installation_html,
                  "faq": faq_html,
                  "changelog": changelog_html,
              },
          }

          output_path = Path(f"{manifest_slug}.json")
          output_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(output_path.read_text(encoding="utf-8"))
          PY

      - name: Upload update manifest by FTPS
        if: github.event_name == 'release'
        env:
          FTP_SERVER: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_SERVER_DIR }}
        run: |
          MANIFEST_SLUG="bloglogistics-maintenance-page"

          sudo apt-get update
          sudo apt-get install -y lftp

          lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" "${FTP_SERVER}" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          cd "${FTP_SERVER_DIR}"
          put "${MANIFEST_SLUG}.json" -o "${MANIFEST_SLUG}.json"
          bye
          EOF
